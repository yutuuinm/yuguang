<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予光 · 管理后台</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/style.css?v=09032145"?>
<style>
  .adm{max-width:1000px;margin:0 auto;padding:120px 20px 80px;}
  .adm h2{font-family:var(--serif);letter-spacing:.2em;color:var(--gold);margin-bottom:6px;}
  .adm-card{max-width:400px;margin:40px auto;}
  .adm input, .adm select, .adm textarea{padding:10px 12px;border-radius:10px;border:1px solid rgba(244,239,230,.2);background:var(--night2);color:var(--moon);font-size:14px;outline:none;width:100%;margin-bottom:10px;}
  .adm .err{color:#ff9b9b;font-size:13px;min-height:16px;text-align:center;}
  .adm .tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .adm .tbl th,.adm .tbl td{border-bottom:1px solid var(--line-soft);padding:8px;text-align:left;vertical-align:top;word-break:break-all;}
  .adm .tbl th{color:var(--gold);font-weight:400;}
  .btn-sm{padding:3px 10px;font-size:12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--moon);margin-right:4px;}
  .btn-sm:hover{border-color:var(--gold);}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;}
  .json-detail{display:none;background:rgba(7,10,18,.8);padding:8px;border-radius:8px;font-size:11px;color:var(--text-dim);white-space:pre-wrap;}
  .msg{color:var(--gold);font-size:13px;min-height:18px;}
  .who{color:var(--text-dim);font-size:13px;}
  .who b{color:var(--gold);font-weight:400;}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header class="nav" id="nav"><div class="nav-inner">
  <img class="nav-logo" src="../予光.jpg" alt="予光 logo">
  <a class="nav-brand" href="index.html">予光</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="collections.html">系列</a>
    <a href="studio.html">定制工坊</a>
    <a href="gallery.html">光集</a>
    <a href="studio.html" style="color:var(--text-dim);font-size:13px;">开始定制</a>
  </nav>
</div></header>

<main><div class="adm">
  <h2 style="text-align:center;">予光 · 管理后台</h2>

  <div class="adm-card doc-block" id="admGate">
    <p style="text-align:center;color:var(--text-dim);font-size:13px;">仅管理员可进入</p>
    <input id="admAccount" placeholder="账号">
    <input id="admPwd" type="password" placeholder="密码">
    <div class="err" id="admErr"></div>
    <button class="btn-gold" style="width:100%;" id="admLogin" type="button">登 录</button>
  </div>

  <div id="admMain" style="display:none;">
    <div class="bar">
      <span class="who" id="admWho"></span>
      <select id="admTable" style="width:auto;">
        <option value="orders">订单 orders</option>
        <option value="messages">留言/投稿 messages</option>
        <option value="gallery">光集 gallery</option>
        <option value="products">商品 products</option>
        <option value="crystals">晶石 crystals</option>
        <option value="records">验真 records</option>
        <option value="subscribers">订阅 subscribers</option>
        <option value="users">用户 users</option>
        <option value="settings">配置 settings</option>
      </select>
      <button class="btn-gold" id="admRefresh" type="button">刷新</button>
      <button class="btn-ghost" id="admExport" type="button" style="font-size:13px;padding:8px 18px;">导出 CSV</button>
      <a class="btn-ghost" style="font-size:13px;padding:8px 18px;" href="index.html">返回主页</a>
      <button class="btn-ghost" style="font-size:13px;padding:8px 18px;" id="admLogout" type="button">退出</button>
      <input id="admResetAcc" placeholder="用户邮箱(重置密码)" style="width:auto;min-width:200px;margin:0;padding:8px 10px;">
      <button class="btn-ghost" style="font-size:13px;padding:8px 14px;" id="admResetBtn" type="button">重置该用户密码</button>
    </div>
    <div class="msg" id="admMsg"></div>
    <div style="overflow-x:auto;"><table class="tbl" id="admRows"></table></div>
    <div id="admSettings" style="display:none;margin-top:20px;">
      <h2 style="font-size:18px;">配置编辑</h2>
      <textarea id="admMail" style="min-height:80px;font-family:monospace;"></textarea>
      <textarea id="admAi" style="min-height:80px;font-family:monospace;"></textarea>
      <div style="margin-top:10px;"><b style="color:var(--gold);font-weight:400;">home_banners（主页展示条数组：title/text/image/link）</b></div>
      <textarea id="admHome" style="min-height:120px;font-family:monospace;"></textarea>
      <button class="btn-gold" id="admSaveCfg" type="button">保存配置</button>
    </div>
  </div>
</div></main>

<footer class="footer"><div class="wrap"><div class="disclaimer">© 予光 YUGUANG · 管理后台 · 仅供内部使用</div></div></footer>

<script src="js/supabase-config.js?v=09032056"></script>
<script src="js/main.js?v=09032145"></script>
<script>
(function () {
  var cfg = window.SUPABASE || {};
  var AAPI = cfg.url + '/functions/v1/account-api';
  var DAPI = cfg.url + '/functions/v1/admin-api';
  var token = localStorage.getItem('yg_token') || '';
  var gate = document.getElementById('admGate');
  var mainEl = document.getElementById('admMain');
  var errEl = document.getElementById('admErr');
  var msg = document.getElementById('admMsg');
  var rowsEl = document.getElementById('admRows');
  var sel = document.getElementById('admTable');

  function api(base, body) {
    return fetch(base, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sess': token }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function enter(account, role, nick) {
    localStorage.setItem('yg_account', account);
    localStorage.setItem('yg_role', role);
    if (nick) localStorage.setItem('yg_nick', nick);
    gate.style.display = 'none';
    mainEl.style.display = 'block';
    document.getElementById('admWho').innerHTML = '👤 <b>' + account + '</b>（' + role + '）· 会话已保存';
    load();
    window.dispatchEvent(new Event('yg:login'));
  }
  function tryEnter() {
    if (!token) return;
    api(AAPI, { op: 'me' }).then(function (r) {
      if (r.ok && r.role === 'admin') enter(r.account, r.role, r.nickname);
      else if (!r.ok) { token = ''; localStorage.removeItem('yg_token'); }
    }).catch(function () {});
  }

  document.getElementById('admLogin').addEventListener('click', function () {
    var ac = (document.getElementById('admAccount').value || '').trim();
    var pw = document.getElementById('admPwd').value;
    if (!ac || !pw) { errEl.textContent = '请输入账号与密码'; return; }
    api(AAPI, { op: 'login', account: ac, password: pw }).then(function (r) {
      if (!r.ok) { errEl.textContent = r.error || '登录失败'; return; }
      if (r.role !== 'admin') { errEl.textContent = '该账号无管理员权限'; return; }
      token = r.token;
      localStorage.setItem('yg_token', token);
      enter(r.account, r.role, r.nickname);
    }).catch(function () { errEl.textContent = '网络错误'; });
  });
  document.getElementById('admResetBtn').addEventListener('click', function () {
    var ac = (document.getElementById('admResetAcc').value || '').trim();
    if (!ac) { msg.textContent = '请输入用户邮箱'; return; }
    if (!confirm('确认重置 ' + ac + ' 的密码？（临时密码将发送到其邮箱）')) return;
    api(AAPI, { op: 'admin_reset', account: ac }).then(function (r) {
      msg.textContent = r.ok ? '已重置，临时密码已发送' : (r.error || '失败');
    }).catch(function () { msg.textContent = '网络错误'; });
  });
  document.getElementById('admLogout').addEventListener('click', function () {
    api(AAPI, { op: 'logout' }).catch(function () {});
    localStorage.removeItem('yg_token');
    location.href = 'index.html';
  });
  document.getElementById('admRefresh').addEventListener('click', load);
  var expBtn = document.getElementById('admExport');
  if (expBtn) expBtn.addEventListener('click', function () {
    var rows = window.__admRows || [];
    if (!rows.length) { msg.textContent = '暂无可导出数据'; return; }
    var keys = Object.keys(rows[0]);
    var csv = [keys.join(',')];
    rows.forEach(function (r) {
      csv.push(keys.map(function (k) {
        var v = r[k];
        var s = typeof v === 'object' ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v);
        return '"' + String(s).replace(/"/g, '""') + '"';
      }).join(','));
    });
    var blob = new Blob(['\ufeff' + csv.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = sel.value + '.csv';
    a.click();
    msg.textContent = '已导出 ' + rows.length + ' 条';
  });

  sel.addEventListener('change', function () {
    document.getElementById('admSettings').style.display = sel.value === 'settings' ? 'block' : 'none';
    load();
  });

  function load() {
    var t = sel.value;
    msg.textContent = '加载中…';
    api(DAPI, { op: 'list', table: t }).then(function (r) {
      if (!r.ok) { msg.textContent = '加载失败：' + (r.error || '（无管理员权限？）'); return; }
      msg.textContent = t + ' 共 ' + (r.rows ? r.rows.length : 0) + ' 条';
      window.__admRows = r.rows || [];
      if (t === 'settings') { loadSettings(r.rows || []); return; }
      renderRows(t, r.rows || []);
    }).catch(function () { msg.textContent = '网络错误'; });
  }

  function loadSettings(rows) {
    rowsEl.innerHTML = '';
    document.getElementById('admSettings').style.display = 'block';
    function pick(k) { for (var i = 0; i < rows.length; i++) if (rows[i].key === k) return rows[i]; return null; }
    var mail = pick('mail'), ai = pick('ai');
    document.getElementById('admMail').value = mail ? JSON.stringify(mail.value, null, 2) : '{}';
    document.getElementById('admAi').value = ai ? JSON.stringify(ai.value, null, 2) : '{}';
    document.getElementById('admHome').value = (function () { var o = pick('home_banners'); return o ? JSON.stringify(o.value, null, 2) : '[]'; })();
    document.getElementById('admSaveCfg').onclick = function () {
      function upd(k, v) { try { return api(DAPI, { op: 'update', table: 'settings', id: k, set: { value: JSON.parse(v) } }); } catch (e) { msg.textContent = k + ' JSON 格式错误'; return null; } }
      Promise.all([upd('mail', document.getElementById('admMail').value), upd('ai', document.getElementById('admAi').value), upd('home_banners', document.getElementById('admHome').value)]).then(function () { msg.textContent = '配置已保存'; });
    };
  }

  var STATUS = { orders: ['new','paid','making','shipped','done','refund'], messages: ['new','read','done'] };

  function renderRows(t, rows) {
    if (!rows.length) { rowsEl.innerHTML = '<tr><td style="color:var(--text-dim);">（暂无数据）</td></tr>'; return; }
    var head = Object.keys(rows[0]);
    var html = '<tr><th>操作</th>';
    head.slice(0, 7).forEach(function (k) { html += '<th>' + esc(k) + '</th>'; });
    html += '<th>详情</th></tr>';
    rows.forEach(function (row, idx) {
      var id = row.id !== undefined ? row.id : row.key;
      html += '<tr><td style="white-space:nowrap;">';
      if (t === 'orders' || t === 'messages') {
        html += '<select class="btn-sm" data-act="status" data-t="' + t + '" data-id="' + esc(id) + '">';
        (STATUS[t] || []).forEach(function (s) { html += '<option value="' + s + '"' + (row.status === s ? ' selected' : '') + '>' + s + '</option>'; });
        html += '</select> ';
      }
      if (t === 'gallery') {
        html += '<button class="btn-sm" data-act="tg" data-col="approved" data-id="' + esc(id) + '" data-v="' + (row.approved ? 'false' : 'true') + '">' + (row.approved ? '下架' : '上架') + '</button> ';
        html += '<button class="btn-sm" data-act="tg" data-col="visible" data-id="' + esc(id) + '" data-v="' + (row.visible ? 'false' : 'true') + '">' + (row.visible ? '隐藏' : '显示') + '</button> ';
      }
      if (t === 'users') {
        html += '<button class="btn-sm" data-act="role" data-id="' + esc(id) + '" data-v="' + (row.role === 'admin' ? 'user' : 'admin') + '">' + (row.role === 'admin' ? '降为user' : '设为admin') + '</button> ';
      }
      html += '<button class="btn-sm" data-act="view" data-i="' + idx + '">JSON</button> ';
      html += '<button class="btn-sm" data-act="del" data-t="' + t + '" data-id="' + esc(id) + '">删除</button></td>';
      head.slice(0, 7).forEach(function (k) {
        var v = row[k];
        html += '<td>' + esc(typeof v === 'object' ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v)).slice(0, 60) + '</td>';
      });
      html += '<td><div class="json-detail" data-detail="' + idx + '">' + esc(JSON.stringify(row, null, 2)) + '</div></td></tr>';
    });
    rowsEl.innerHTML = html;
    rowsEl.querySelectorAll('[data-act="view"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = rowsEl.querySelector('[data-detail="' + b.getAttribute('data-i') + '"]');
        d.style.display = d.style.display === 'block' ? 'none' : 'block';
      });
    });
    rowsEl.querySelectorAll('[data-act="del"]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('确认删除？')) return;
        api(DAPI, { op: 'delete', table: b.getAttribute('data-t'), id: b.getAttribute('data-id') }).then(function (r) { msg.textContent = r.ok ? '已删除' : '失败：' + (r.error || ''); load(); });
      });
    });
    rowsEl.querySelectorAll('[data-act="status"]').forEach(function (b) {
      b.addEventListener('change', function () {
        api(DAPI, { op: 'update', table: b.getAttribute('data-t'), id: b.getAttribute('data-id'), set: { status: b.value } }).then(function (r) { msg.textContent = r.ok ? '已更新' : '失败'; });
      });
    });
    rowsEl.querySelectorAll('[data-act="tg"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var set = {}; set[b.getAttribute('data-col')] = b.getAttribute('data-v') === 'true';
        api(DAPI, { op: 'update', table: 'gallery', id: b.getAttribute('data-id'), set: set }).then(function (r) { msg.textContent = r.ok ? '已更新' : '失败'; load(); });
      });
    });
    rowsEl.querySelectorAll('[data-act="role"]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('更改该用户角色？')) return;
        api(DAPI, { op: 'update', table: 'users', id: b.getAttribute('data-id'), set: { role: b.getAttribute('data-v') } }).then(function (r) { msg.textContent = r.ok ? '已更新' : '失败'; load(); });
      });
    });
  }

  tryEnter();
})();
</script>
</body>
</html>
