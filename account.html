<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 予光</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/style.css?v=09032151"?>
<style>
  .acc{max-width:620px;margin:0 auto;padding:110px 18px 80px;}
  .back{color:var(--gold);font-size:13px;text-decoration:none;}
  .me-top{display:flex;align-items:center;gap:16px;margin:16px 0 8px;padding:18px;border:1px solid var(--line-soft);border-radius:16px;background:linear-gradient(165deg,rgba(20,27,46,.85),rgba(11,14,23,.9));}
  .me-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#14121a;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .me-top b{color:var(--moon);font-size:17px;}
  .me-top small{color:var(--text-dim);font-size:12px;display:block;margin-top:2px;}
  .menu-card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(16,24,40,.55);color:var(--moon);font-size:15px;cursor:pointer;}
  .menu-card span{color:var(--text-dim);font-size:13px;}
  .panel{display:none;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;background:linear-gradient(170deg,rgba(20,27,46,.9),rgba(11,14,23,.94));}
  .panel.open{display:block;}
  .panel h4{color:var(--gold);font-family:var(--serif);letter-spacing:.12em;margin-bottom:12px;}
  .acc input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(244,239,230,.18);background:var(--night2);color:var(--moon);font-size:14px;outline:none;margin-bottom:10px;}
  .acc input:focus{border-color:var(--gold);}
  .acc .msg{color:var(--gold);font-size:13px;min-height:15px;margin:4px 0 8px;}
  .acc .row{display:flex;gap:8px;}
  .m-item{border:1px solid var(--line-soft);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:13px;color:var(--moon);}
  .m-item b{color:var(--gold);font-weight:400;}
  .m-item p{color:var(--text-dim);font-size:12px;line-height:1.8;margin:4px 0 0;}
  .order-row{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px;margin-bottom:9px;font-size:13px;}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header class="nav" id="nav"><div class="nav-inner">
  <img class="nav-logo" src="../予光.jpg" alt="予光 logo">
  <a class="nav-brand" href="index.html">予光</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="collections.html">系列</a>
    <a href="studio.html">定制工坊</a>
    <a href="gallery.html">光集</a>
    <a href="atlas.html">星图志</a>
    <a href="play.html">互动</a>
    <a href="index.html" style="color:var(--text-dim);font-size:13px;">开始定制</a>
  </nav>
</div></header>

<main><div class="acc">
  <a class="back" href="javascript:void(0)" id="backTop">← 返回</a>
  <div class="me-line" id="meLine" style="display:none;align-items:center;gap:10px;margin:10px 0 4px;padding:10px 4px;"><span class="me-dot" id="meDot" style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#14121a;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:17px;">光</span><b style="color:var(--moon);font-size:16px;" id="meLineName"></b></div>

  <div id="menuList" style="margin-top:14px;">
    <button class="menu-card" data-p="edit" type="button">✏️ 编辑资料<span>账号 / 昵称 / 手机号</span></button>
    <button class="menu-card" data-p="email" type="button">📮 更换邮箱<span>需原邮箱验证码</span></button>
    <button class="menu-card" data-p="pw" type="button">🔒 修改密码</button>
    <button class="menu-card" data-p="orders" type="button">📦 我的订单</button>
    <button class="menu-card" data-p="inbox" type="button">🔔 信箱</button>
  </div>

  <div class="panel" id="p-edit">
    <h4>编辑资料</h4>
    <input id="acAccount" placeholder="账号">
    <input id="acNick" placeholder="昵称（头像=首字）">
    <input id="acPhone" type="tel" placeholder="手机号（选填）">
    <div class="msg" id="editMsg"></div>
    <button class="btn-gold" id="acSave" type="button" style="width:100%;">保存</button>
  </div>

  <div class="panel"   <div class="panel" id="p-email">
    <h4>更换邮箱</h4>
    <p style="color:var(--text-dim);font-size:13px;margin:0 0 8px;">① 输入当前(旧)邮箱并获取验证码</p>
    <div class="row">
      <input id="oldEmail" type="email" placeholder="当前邮箱（收验证码）">
      <button class="btn-ghost" id="acSend" type="button" style="flex-shrink:0;padding:8px 14px;font-size:13px;">获取验证码</button>
    </div>
    <input id="acCode" placeholder="旧邮箱收到的 6 位验证码" style="display:none;">
    <p style="color:var(--text-dim);font-size:13px;margin:10px 0 4px;">② 输入新邮箱</p>
    <input id="acEmail" type="email" placeholder="新邮箱（验证通过后可填）" disabled>
    <div class="msg" id="mailMsg"></div>
    <button class="btn-gold" id="acSaveEmail" type="button" style="width:100%;">确认更换</button>
  </div>

id="p-pw">
    <h4>修改密码</h4>
    <input id="acOld" type="password" placeholder="原密码">
    <input id="acNew" type="password" placeholder="新密码（至少 6 位）">
    <div class="msg" id="pwMsg"></div>
    <button class="btn-gold" id="acPw" type="button" style="width:100%;">修改</button>
  </div>

  <div class="panel" id="p-orders">
    <h4>我的订单</h4><div id="ordersBox"><p style="color:var(--text-dim);font-size:13px;">加载中…</p></div></div>
  <div class="panel" id="p-inbox">
    <h4>信箱</h4><div id="inboxBox"><p style="color:var(--text-dim);font-size:13px;">加载中…</p></div></div>

  <div style="display:flex;gap:12px;justify-content:center;margin-top:18px;">
    <button class="btn-ghost" id="acOut" type="button">退出登录</button>
  </div>
</div></main>

<footer class="footer"><div class="wrap"><div class="disclaimer">© 予光 YUGUANG</div></div></footer>

<script src="js/supabase-config.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  var cfg = window.SUPABASE || {};
  var API = cfg.url + '/functions/v1/account-api';
  var token = localStorage.getItem('yg_token') || '';
  var account = localStorage.getItem('yg_account') || '';
  function api(body) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sess': token }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function msg(id, t) { var el = document.getElementById(id); if (el) el.textContent = t; }
  var menuList = document.getElementById('menuList');
  var backTop = document.getElementById('backTop');
  function anyOpen(){ return !!document.querySelector('.panel.open'); }
  if (backTop) backTop.addEventListener('click', function(){ if (anyOpen()) goBack(); else history.back(); });
  function closeAll() { document.querySelectorAll('.panel').forEach(function (x) { x.classList.remove('open'); }); }
  function goBack() {
    closeAll();
    if (menuList) { menuList.classList.remove('hide'); menuList.classList.remove('anim-in'); void menuList.offsetWidth; menuList.classList.add('anim-in'); }
  }
  document.querySelectorAll('.menu-card').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = 'p-' + b.getAttribute('data-p');
      var panel = document.getElementById(p);
      if (!panel) return;
      if (menuList) menuList.classList.add('hide');
      closeAll();
      panel.classList.remove('open'); void panel.offsetWidth; panel.classList.add('open');
      if (p === 'p-orders') loadOrders();
      if (p === 'p-inbox') loadInbox();
      if (p === 'p-email') { var ce = document.getElementById('curEmail'); if (ce) ce.textContent = account; }
    });
  });

  function setLine(n,a){ var dot=document.getElementById('meDot'); if(dot) dot.textContent=((n||a||'光').trim().charAt(0)); var nm=document.getElementById('meLineName'); if(nm) nm.textContent=(n||a||''); var ln=document.getElementById('meLine'); if(ln) ln.style.display='flex'; }
  function fill(r) {
    setLine(r.nickname, r.account);
    account = r.account;
    localStorage.setItem('yg_account', r.account);
    localStorage.setItem('yg_nick', r.nickname || '');
    var ac = document.getElementById('acAccount'); if (ac) ac.value = r.account;
    var nk = document.getElementById('acNick'); if (nk) nk.value = r.nickname || '';
    var ph = document.getElementById('acPhone'); if (ph) ph.value = r.phone || '';
    var em = document.getElementById('acEmail'); if (em) em.value = r.email || r.account;
    var ce = document.getElementById('curEmail'); if (ce) ce.textContent = r.email || r.account;
  }
  function doMe(times) {
    if (!token) return;
    var la=localStorage.getItem('yg_account')||'', ln2=localStorage.getItem('yg_nick')||'';
    if (la) setLine(ln2, la);
    api({ op: 'me' }).then(function (r) {
      if (!r.ok) { if ((times || 0) < 1) { setTimeout(function () { doMe((times || 0) + 1); }, 900); } return; }
      fill(r);
    }).catch(function () { if ((times || 0) < 1) { setTimeout(function () { doMe((times || 0) + 1); }, 1200); } });
  }
  function loadOrders() {
    var box = document.getElementById('ordersBox');
    api({ op: 'orders' }).then(function (r) {
      if (!r.ok || !r.orders || !r.orders.length) { box.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">还没有订单 ✦ 去定制工坊生成第一枚光吧。</p>'; return; }
      var st = { new: '待确认', paid: '已确认', making: '制作中', shipped: '已发货', done: '已完成', refund: '退款中' };
      box.innerHTML = r.orders.map(function (o) {
        var items = [];
        try { var arr = (typeof o.items === 'string') ? JSON.parse(o.items) : (o.items || []); items = arr.map(function (x) { return x.name || ''; }); } catch (e) {}
        return '<div class="order-row"><span class="on" style="color:var(--gold);">' + (o.order_no || '') + '</span><span>¥' + (o.amount || '—') + '</span><span>' + (st[o.status] || o.status) + '</span><span style="flex-basis:100%;color:var(--text-dim);">' + (items.join('、') || '定制订单') + ' · ' + String(o.created_at || '').replace('T', ' ').slice(0, 16) + '</span></div>';
      }).join('');
    }).catch(function () { box.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">订单加载失败</p>'; });
  }
  function loadInbox() {
    var box = document.getElementById('inboxBox');
    api({ op: 'inbox' }).then(function (r) {
      if (!r.ok || !r.items || !r.items.length) { box.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">信箱为空</p>'; return; }
      var ids = [];
      box.innerHTML = r.items.map(function (it) {
        if (!it.read) ids.push(it.id);
        return '<div class="m-item"><b>' + (it.kind === 'important' ? '🔔 ' : '📣 ') + it.title + '</b><p>' + it.body + '<br><span style="color:var(--text-dim);">' + String(it.created_at || '').replace('T', ' ').slice(0, 16) + '</span></p></div>';
      }).join('');
      if (ids.length) api({ op: 'inbox_read', ids: ids }).catch(function () {});
    }).catch(function () { box.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">信箱加载失败</p>'; });
  }
  document.getElementById('acSave').addEventListener('click', function () {
    api({ op: 'update_profile', account: document.getElementById('acAccount').value.trim(), nickname: document.getElementById('acNick').value.trim(), phone: document.getElementById('acPhone').value.trim() })
      .then(function (r) { if (r.ok) { localStorage.setItem('yg_account', document.getElementById('acAccount').value.trim()); localStorage.setItem('yg_nick', document.getElementById('acNick').value.trim()); msg('editMsg', '已保存'); } else msg('editMsg', r.error || '保存失败'); })
      .catch(function () { msg('editMsg', '网络错误'); });
  });
  var cd = 0;
  document.getElementById('acSend').addEventListener('click', function () {
    if (cd > 0) return;
    msg('mailMsg', '正在发送…');
    api({ op: 'send_code', email: (document.getElementById('oldEmail').value || '').trim() }).then(function (r) {
      if (r.ok) {
        document.getElementById('acCode').style.display = 'block';
        document.getElementById('acEmail').disabled = false;
        msg('mailMsg', '发送成功，请查看原邮箱并输入验证码，再填新邮箱');
        cd = 60; var b = document.getElementById('acSend'); b.textContent = '已发送(' + cd + ')';
        var t = setInterval(function () { cd--; if (cd <= 0) { clearInterval(t); b.textContent = '发验证码'; } else b.textContent = '已发送(' + cd + ')'; }, 1000);
      } else msg('mailMsg', r.error || '发送失败');
    }).catch(function () { msg('mailMsg', '网络错误'); });
  });
  document.getElementById('acSaveEmail').addEventListener('click', function () {
    var newEmail = document.getElementById('acEmail').value.trim();
    var code = document.getElementById('acCode').value.trim();
    if (!newEmail || !code) { msg('mailMsg', '请先获取验证码并填写新邮箱'); return; }
    api({ op: 'update_profile', email: newEmail, code: code }).then(function (r) { msg('mailMsg', r.ok ? '邮箱已更换' : (r.error || '更换失败')); }).catch(function () { msg('mailMsg', '网络错误'); });
  });
  document.getElementById('acPw').addEventListener('click', function () {
    api({ op: 'change_pw', old_password: document.getElementById('acOld').value, new_password: document.getElementById('acNew').value })
      .then(function (r) { msg('pwMsg', r.ok ? '密码已修改' : (r.error || '失败')); if (r.ok) { document.getElementById('acOld').value = ''; document.getElementById('acNew').value = ''; } })
      .catch(function () { msg('pwMsg', '网络错误'); });
  });
  document.getElementById('acOut').addEventListener('click', function () {
    api({ op: 'logout' }).catch(function () {});
    ['yg_token', 'yg_account', 'yg_role', 'yg_nick'].forEach(function (k) { localStorage.removeItem(k); });
    location.href = 'index.html';
  });
  doMe(0);
  var map = { edit: 'p-edit', email: 'p-email', pw: 'p-pw', orders: 'p-orders', inbox: 'p-inbox' };
  var target = map[(location.hash || '').replace('#', '')];
  if (target) { var p = document.getElementById(target); if (p) { if (menuList) menuList.classList.add('hide'); p.classList.add('open'); if (target === 'p-orders') loadOrders(); if (target === 'p-inbox') loadInbox(); } }
})();
</script>
</body>
</html>
