<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予光 · 拾光铺</title>
<meta name="description" content="拾光铺——转一轮微光小礼，再挑一枚想带走的光。">
<link rel="stylesheet" href="css/style.css?v=09042041">
<style>
  .shop-hero{text-align:center;padding:118px 20px 8px;}
  .shop-enter{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:26px auto 8px;}
  .shop-enter button{min-width:200px;padding:22px 26px;font-size:16px;letter-spacing:.14em;border-radius:18px;}
  .shop-enter .g{display:block;font-size:30px;margin-bottom:6px;}
  .shop-panel{display:none;}
  .shop-panel.on{display:block;animation:admIn .4s ease both;}
  .shop-wheel-wrap{max-width:420px;margin:10px auto;text-align:center;}
  .shop-disc{width:min(240px,80vw);height:min(240px,80vw);margin:14px auto;border-radius:50%;position:relative;transition:transform 4.2s cubic-bezier(.16,.84,.22,1);border:3px solid rgba(227,196,124,.5);}
  .shop-disc span{position:absolute;font-size:12px;color:#0b0e17;font-weight:600;}
  .shop-pin{position:absolute;left:50%;top:-10px;transform:translateX(-50%);color:var(--gold);font-size:20px;z-index:2;}
  .shop-msg{color:var(--gold);font-size:13px;min-height:22px;margin-top:6px;}
  .hs-grid{margin-top:12px;}
  .shop-tip{max-width:560px;margin:14px auto;color:var(--text-dim);font-size:12.5px;line-height:2;text-align:center;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<header class="nav" id="nav"><div class="nav-inner">
  <img class="nav-logo" src="予光.jpg" alt="予光 logo">
  <a class="nav-brand" href="index.html">予光</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="collections.html">系列</a>
    <a href="studio.html">定制工坊</a>
    <a href="gallery.html">光集</a>
    <a href="shop.html">拾光铺</a>
    <a href="studio.html" style="color:var(--text-dim);font-size:13px;">开始定制</a>
  </nav>
</div></header>
<main>
  <div class="shop-hero">
    <h1 class="reveal visible" style="font-family:var(--serif);letter-spacing:.3em;color:var(--moon);">拾光铺</h1>
    <p class="reveal visible" style="color:var(--text-dim);">先转一轮小礼，再挑一枚想带走的光 ✦</p>
    <div class="shop-enter reveal visible">
      <button class="btn-ghost" id="shopTabWheel" type="button"><span class="g">🎡</span>幸运转盘</button>
      <button class="btn-gold" id="shopTabCab" type="button"><span class="g">🛍️</span>臻品橱窗</button>
    </div>
  </div>
  <section class="section">
    <div class="wrap">
      <div class="shop-panel on" id="shopWheelPanel">
        <div class="shop-wheel-wrap">
          <h2 style="font-family:var(--serif);letter-spacing:.2em;color:var(--gold);font-size:17px;">每日一转 · 立减券</h2>
          <p class="shop-tip" style="margin:6px auto 0;">转出立减券后，去「臻品橱窗」选一枚光下单，金额会自动抵扣 ✦ 券当日有效。</p>
          <div class="shop-disc-wrap" style="position:relative;margin-top:8px;">
            <span class="shop-pin">▼</span>
            <div class="shop-disc" id="shopDisc"></div>
          </div>
          <button class="btn-gold" id="shopSpin" type="button" style="margin-top:6px;">转 一 转</button>
          <div class="shop-msg" id="shopSpinMsg">转盘已备好 ✦ 每日一次</div>
        </div>
      </div>
      <div class="shop-panel" id="shopCabPanel">
        <h2 style="text-align:center;font-family:var(--serif);letter-spacing:.2em;color:var(--gold);font-size:17px;">臻品橱窗</h2>
        <p class="shop-tip" style="text-align:center;">例款一览 · 点「选择这枚光」填收货地址即可下单，予光会第一时间与你确认</p>
        <div class="hs-grid" id="shopGrid"><p style="text-align:center;color:var(--text-dim);" class="section-sub">正在整理橱窗…</p></div>
      </div>
    </div>
  </section>
</main>
<footer class="footer"><div class="wrap"><div class="disclaimer">予光所有产品均为饰品；生肖、八卦、星座、星盘等符号及其解读源自传统文化与流行文化中的象征寓意，属文化意象的表达与陪伴。© 予光 YUGUANG · 拾光铺</div></div></footer>
<script src="js/supabase-config.js?v=09042041"></script>
<script src="js/main.js?v=09042041"></script>
<script>
(function () {
  var DIS = document.getElementById('shopDisc');
  var DAY = 'yg_buy_wheel_day';
  var WCOL = ['#e3c47c', '#c9575b', '#8fa3d9', '#6fa87f'];
  function today() { return new Date().toDateString(); }
  function used() { return localStorage.getItem(DAY) === today(); }
  function paint(tiers) {
    if (!DIS) return;
    var st = [];
    for (var i = 0; i < 4; i++) st.push(WCOL[i] + ' ' + (i * 90) + 'deg ' + ((i + 1) * 90) + 'deg');
    DIS.style.background = 'conic-gradient(' + st.join(',') + ')';
    var labels = DIS.querySelectorAll('span');
    for (var k = 0; k < labels.length; k++) {
      var a = k * 90 + 45;
      labels[k].style.transform = 'translate(-50%,-50%) rotate(' + a + 'deg) translateY(-' + Math.round(DIS.offsetWidth * 0.29) + 'px) rotate(' + (-a) + 'deg)';
      labels[k].textContent = (tiers && tiers[k] != null) ? '¥' + tiers[k] : '';
    }
  }
  var tiers = [28, 48, 68, 88];
  function loadCfg() {
    if (!window.sb) return;
    try {
      window.sb('app_data?select=value&key=eq.wheel').then(function (rows) {
        var v = rows && rows[0] && rows[0].value;
        var o = v ? (typeof v === 'string' ? JSON.parse(v) : v) : null;
        if (o && o.min != null && o.max != null) {
          tiers = [];
          for (var i = 0; i < 4; i++) tiers.push(Math.round(o.min + (o.max - o.min) * i / 3));
        }
        paint(tiers);
      }).catch(function () { paint(tiers); });
    } catch (e) { paint(tiers); }
  }
  DIS.innerHTML = '<span></span><span></span><span></span><span></span>';
  paint(tiers);
  var deg = 0;
  var spinBtn = document.getElementById('shopSpin');
  var spinMsg = document.getElementById('shopSpinMsg');
  function pickIdx() {
    var p = [25, 25, 25, 25];
    var r = Math.random() * 100, acc = 0;
    for (var i = 0; i < 4; i++) { acc += p[i]; if (r <= acc) return i; }
    return 3;
  }
  if (spinBtn) spinBtn.addEventListener('click', function () {
    if (used()) { spinMsg.innerHTML = '今日已转过 ✦ 明日再来'; spinBtn.disabled = true; return; }
    spinBtn.disabled = true;
    spinMsg.innerHTML = '微光转动中…';
    var idx = pickIdx();
    var delta = (315 - 90 * idx - (deg % 360) + 360) % 360;
    deg += 360 * (4 + Math.floor(Math.random() * 3)) + delta;
    DIS.style.transform = 'rotate(' + deg + 'deg)';
    setTimeout(function () {
      var amt = tiers[idx];
      localStorage.setItem(DAY, today());
      try { sessionStorage.setItem('yg_voucher', JSON.stringify({ d: today(), amt: amt })); } catch (e) {}
      spinMsg.innerHTML = '本单立减 <b style="color:var(--gold)">¥' + amt + '</b> ✦ 去臻品橱窗下单即自动抵扣';
      spinBtn.disabled = true;
    }, 4300);
  });
  var wTab = document.getElementById('shopTabWheel');
  var cTab = document.getElementById('shopTabCab');
  function show(id) {
    document.querySelectorAll('.shop-panel').forEach(function (p) { p.classList.remove('on'); });
    var el = document.getElementById(id); if (el) el.classList.add('on');
  }
  if (wTab) wTab.addEventListener('click', function () { show('shopWheelPanel'); });
  if (cTab) cTab.addEventListener('click', function () { show('shopCabPanel'); });
  loadCfg();
})();
</script>
</body>
</html>
