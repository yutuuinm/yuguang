<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予光 · 管理后台</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/style.css?v=09032226">
<style>
  .adm{max-width:1000px;margin:0 auto;padding:120px 20px 80px;}
  .adm h2{font-family:var(--serif);letter-spacing:.2em;color:var(--gold);margin-bottom:6px;}
  .adm-card{max-width:400px;margin:40px auto;}
  .adm input, .adm select, .adm textarea{padding:10px 12px;border-radius:10px;border:1px solid rgba(244,239,230,.2);background:var(--night2);color:var(--moon);font-size:14px;outline:none;width:100%;margin-bottom:10px;}
  .adm .err{color:#ff9b9b;font-size:13px;min-height:16px;text-align:center;}
  .adm .tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .adm .tbl th,.adm .tbl td{border-bottom:1px solid var(--line-soft);padding:8px;text-align:left;vertical-align:top;word-break:break-all;}
  .adm .tbl th{color:var(--gold);font-weight:400;}
  .btn-sm{padding:3px 10px;font-size:12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--moon);margin-right:4px;}
  .btn-sm:hover{border-color:var(--gold);}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;}
  .json-detail{display:none;background:rgba(7,10,18,.8);padding:8px;border-radius:8px;font-size:11px;color:var(--text-dim);white-space:pre-wrap;}
  .msg{color:var(--gold);font-size:13px;min-height:18px;}
  .who{color:var(--text-dim);font-size:13px;}
  .who b{color:var(--gold);font-weight:400;}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header class="nav" id="nav"><div class="nav-inner">
  <img class="nav-logo" src="予光.jpg" alt="予光 logo">
  <a class="nav-brand" href="index.html">予光</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="collections.html">系列</a>
    <a href="studio.html">定制工坊</a>
    <a href="gallery.html">光集</a>
    <a href="studio.html" style="color:var(--text-dim);font-size:13px;">开始定制</a>
  </nav>
</div></header>

<main><div class="adm">
  <h2 style="text-align:center;">予光 · 管理后台</h2>

  <div class="adm-card doc-block" id="admGate">
    <p style="text-align:center;color:var(--text-dim);font-size:13px;">仅管理员可进入</p>
    <input id="admAccount" placeholder="账号">
    <input id="admPwd" type="password" placeholder="密码">
    <div class="err" id="admErr"></div>
    <button class="btn-gold" style="width:100%;" id="admLogin" type="button">登 录</button>
  </div>

  <div id="admMain" style="display:none;">
    <div class="bar">
      <span class="who" id="admWho"></span>
      <select id="admTable" style="width:auto;">
        <option value="orders">订单 orders</option>
        <option value="messages">留言/投稿 messages</option>
        <option value="gallery">光集 gallery</option>
        <option value="products">商品 products</option>
        <option value="crystals">晶石 crystals</option>
        <option value="records">验真 records</option>
        <option value="subscribers">订阅 subscribers</option>
        <option value="users">用户 users</option>
        <option value="settings">配置 settings</option>
        <option value="app_data">配置项 app_data</option>
        <option value="wheel_spins">转盘 wheel_spins</option>
        <option value="ai_usage">AI用量 ai_usage</option>
        <option value="recycle_bin">回收站 recycle_bin</option>
        <option value="mailboxes">站内信 mailboxes</option>
      </select>
      <button class="btn-gold" id="admRefresh" type="button">刷新</button>
      <input id="admSearch" placeholder="搜索本表…" style="width:auto;min-width:170px;margin:0;padding:8px 10px;">
      <button class="btn-ghost" id="admExport" type="button" style="font-size:13px;padding:8px 18px;">导出 CSV</button>
      <a class="btn-ghost" style="font-size:13px;padding:8px 18px;" href="index.html">返回主页</a>
      <button class="btn-ghost" style="font-size:13px;padding:8px 18px;" id="admLogout" type="button">退出</button>
      <input id="admResetAcc" placeholder="用户邮箱(重置密码)" style="width:auto;min-width:200px;margin:0;padding:8px 10px;">
      <button class="btn-ghost" style="font-size:13px;padding:8px 14px;" id="admResetBtn" type="button">重置该用户密码</button>
    </div>
    <div class="msg" id="admMsg"></div>
    <div style="overflow-x:auto;"><table class="tbl" id="admRows"></table></div>
    <div id="admSettings" style="display:none;margin-top:20px;">
      <h2 style="font-size:18px;">配置编辑</h2>
      <textarea id="admMail" style="min-height:80px;font-family:monospace;"></textarea>
      <textarea id="admAi" style="min-height:80px;font-family:monospace;"></textarea>
      <div style="margin-top:10px;"><b style="color:var(--gold);font-weight:400;">home_banners（主页展示条数组：title/text/image/link）</b></div>
      <textarea id="admHome" style="min-height:120px;font-family:monospace;"></textarea>
      <button class="btn-gold" id="admSaveCfg" type="button">保存配置</button>
    </div>
  <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;">
    <button class="btn-ghost adm-tool-btn" data-t="crystal" type="button" style="font-size:13px;padding:8px 16px;">💎 新增晶石</button>
    <button class="btn-ghost adm-tool-btn" data-t="record" type="button" style="font-size:13px;padding:8px 16px;">🔑 生成验真码</button>
    <button class="btn-ghost adm-tool-btn" data-t="broadcast" type="button" style="font-size:13px;padding:8px 16px;">📨 群发站内信</button>
    <button class="btn-ghost adm-tool-btn" data-t="notice" type="button" style="font-size:13px;padding:8px 16px;">📢 活动通知</button>
  </div>
  <div class="adm-tool adm-tool-crystal doc-block" style="display:none;margin-top:12px;">
    <input id="crName" placeholder="名称(必填)"><input id="crKind" placeholder="归属"><input id="crElement" placeholder="五行/星体">
    <input id="crMeaning" placeholder="意象/含义">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="crPrice" placeholder="价格(元)" style="flex:1;min-width:100px;"><input id="crStock" placeholder="库存" style="flex:1;min-width:80px;">
      <input id="crSize" placeholder="尺寸mm" style="flex:1;min-width:90px;"><input id="crShape" placeholder="形状" style="flex:1;min-width:90px;"><input id="crColor" placeholder="色值" style="flex:1;min-width:100px;">
    </div>
    <input id="crCare" placeholder="养护提示"><input id="crImg" placeholder="图片路径(客户图片/xx.jpg 或URL)">
    <div class="msg" id="crMsg"></div>
    <button class="btn-gold" id="crSave" type="button">保存晶石</button>
  </div>
  <div class="adm-tool adm-tool-record doc-block" style="display:none;margin-top:12px;">
    <input id="recName" placeholder="作品名"><input id="recNote" placeholder="备注(选填)"><input id="recImg" placeholder="图片文件名(选填,逗号分隔)">
    <input id="recQty" type="number" min="1" max="50" placeholder="数量 1-50" style="width:130px;">
    <div class="msg" id="recMsg"></div>
    <button class="btn-gold" id="recGen" type="button">生成验真码</button>
    <div id="recOut" style="font-family:monospace;font-size:12px;color:var(--gold);white-space:pre-wrap;margin-top:8px;"></div>
  </div>

  <div class="adm-tool adm-tool-broadcast doc-block" style="display:none;margin-top:12px;">
    <input id="bcTitle" placeholder="标题（如：新品上架 / 活动公告）">
    <textarea id="bcBody" style="min-height:70px;" placeholder="内容（发给全部注册用户的站内信）"></textarea>
    <div class="msg" id="bcMsg"></div>
    <button class="btn-gold" id="bcSend" type="button">群发站内信</button>
  </div>
  <div class="adm-tool adm-tool-notice doc-block" style="display:none;margin-top:12px;">
    <textarea id="noticeTxt" style="min-height:70px;" placeholder="通知内容，留空则关闭"></textarea>
    <div class="msg" id="noticeMsg"></div>
    <button class="btn-gold" id="noticeSave" type="button">保存活动通知</button>
  </div>

  </div>
</div></main>

<footer class="footer"><div class="wrap"><div class="disclaimer">© 予光 YUGUANG · 管理后台 · 仅供内部使用</div></div></footer>

<script src="js/supabase-config.js?v=09032226"></script>
<script src="js/main.js?v=09032226"></script>
<script>
(function () {
  var cfg = window.SUPABASE || {};
  var AAPI = cfg.url + '/functions/v1/account-api';
  var DAPI = cfg.url + '/functions/v1/admin-api';
  var token = localStorage.getItem('yg_token') || '';
  var gate = document.getElementById('admGate');
  var mainEl = document.getElementById('admMain');
  var errEl = document.getElementById('admErr');
  var msg = document.getElementById('admMsg');
  var rowsEl = document.getElementById('admRows');
  var sel = document.getElementById('admTable');

  function api(base, body) {
    return fetch(base, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sess': token }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function enter(account, role, nick) {
    localStorage.setItem('yg_account', account);
    localStorage.setItem('yg_role', role);
    if (nick) localStorage.setItem('yg_nick', nick);
    gate.style.display = 'none';
    mainEl.style.display = 'block';
    document.getElementById('admWho').innerHTML = '👤 <b>' + account + '</b>（' + role + '）· 会话已保存';
    load();
    window.dispatchEvent(new Event('yg:login'));
  }
  function tryEnter() {
    if (!token) return;
    api(AAPI, { op: 'me' }).then(function (r) {
      if (r.ok && (r.role === 'admin' || r.role === 'root')) enter(r.account, r.role, r.nickname);
      else if (!r.ok) { document.getElementById('admErr').textContent = '正在验证登录状态…'; }
    }).catch(function () {});
  }

  document.getElementById('admLogin').addEventListener('click', function () {
    var ac = (document.getElementById('admAccount').value || '').trim();
    var pw = document.getElementById('admPwd').value;
    if (!ac || !pw) { errEl.textContent = '请输入账号与密码'; return; }
    api(AAPI, { op: 'login', account: ac, password: pw }).then(function (r) {
      if (!r.ok) { errEl.textContent = r.error || '登录失败'; return; }
      if (r.role !== 'admin' && r.role !== 'root') { errEl.textContent = '该账号无管理员权限'; return; }
      token = r.token;
      localStorage.setItem('yg_token', token);
      enter(r.account, r.role, r.nickname);
    }).catch(function () { errEl.textContent = '网络错误'; });
  });
  document.getElementById('admResetBtn').addEventListener('click', function () {
    var ac = (document.getElementById('admResetAcc').value || '').trim();
    if (!ac) { msg.textContent = '请输入用户邮箱'; return; }
    if (!confirm('确认重置 ' + ac + ' 的密码？（临时密码将发送到其邮箱）')) return;
    api(AAPI, { op: 'admin_reset', account: ac }).then(function (r) {
      msg.textContent = r.ok ? '已重置，临时密码已发送' : (r.error || '失败');
    }).catch(function () { msg.textContent = '网络错误'; });
  });
  document.getElementById('admLogout').addEventListener('click', function () {
    api(AAPI, { op: 'logout' }).catch(function () {});
    localStorage.removeItem('yg_token');
    location.href = 'index.html';
  });
  document.getElementById('admRefresh').addEventListener('click', load);
  var expBtn = document.getElementById('admExport');
  if (expBtn) expBtn.addEventListener('click', function () {
    var rows = window.__admRows || [];
    if (!rows.length) { msg.textContent = '暂无可导出数据'; return; }
    var keys = Object.keys(rows[0]);
    var csv = [keys.join(',')];
    rows.forEach(function (r) {
      csv.push(keys.map(function (k) {
        var v = r[k];
        var s = typeof v === 'object' ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v);
        return '"' + String(s).replace(/"/g, '""') + '"';
      }).join(','));
    });
    var blob = new Blob(['\ufeff' + csv.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = sel.value + '.csv';
    a.click();
    msg.textContent = '已导出 ' + rows.length + ' 条';
  });

  sel.addEventListener('change', function () {
    document.getElementById('admSettings').style.display = sel.value === 'settings' ? 'block' : 'none';
    load();
  });

  function load() {
    var t = sel.value;
    msg.textContent = '加载中…';
    api(DAPI, { op: 'list', table: t }).then(function (r) {
      if (!r.ok) { msg.textContent = '加载失败：' + (r.error || '（无管理员权限？）'); return; }
      msg.textContent = t + ' 共 ' + (r.rows ? r.rows.length : 0) + ' 条';
      allRows = r.rows || [];
      window.__admRows = allRows;
      if (t === 'settings') { loadSettings(allRows); return; }
      var q = (admSearch && admSearch.value || '').trim().toLowerCase();
      var rows = q ? allRows.filter(function (x) { return JSON.stringify(x).toLowerCase().indexOf(q) > -1; }) : allRows;
      window.__admRows = rows;
      msg.textContent = t + ' 共 ' + rows.length + ' 条';
      renderRows(t, rows);
    }).catch(function () { msg.textContent = '网络错误'; });
  }

  function loadSettings(rows) {
    rowsEl.innerHTML = '';
    document.getElementById('admSettings').style.display = 'block';
    function pick(k) { for (var i = 0; i < rows.length; i++) if (rows[i].key === k) return rows[i]; return null; }
    var mail = pick('mail'), ai = pick('ai');
    document.getElementById('admMail').value = mail ? JSON.stringify(mail.value, null, 2) : '{}';
    document.getElementById('admAi').value = ai ? JSON.stringify(ai.value, null, 2) : '{}';
    document.getElementById('admHome').value = (function () { var o = pick('home_banners'); return o ? JSON.stringify(o.value, null, 2) : '[]'; })();
    document.getElementById('admSaveCfg').onclick = function () {
      function upd(k, v) { try { return api(DAPI, { op: 'update', table: 'settings', id: k, set: { value: JSON.parse(v) } }); } catch (e) { msg.textContent = k + ' JSON 格式错误'; return null; } }
      Promise.all([upd('mail', document.getElementById('admMail').value), upd('ai', document.getElementById('admAi').value), upd('home_banners', document.getElementById('admHome').value)]).then(function () { msg.textContent = '配置已保存'; });
    };
  }

  var STATUS = { orders: ['new','paid','making','shipped','done','refund'], messages: ['new','read','done'] };

  function renderRows(t, rows) {
    if (!rows.length) { rowsEl.innerHTML = '<tr><td style="color:var(--text-dim);">（暂无数据）</td></tr>'; return; }
    var head = Object.keys(rows[0]);
    var html = '<tr><th>操作</th>';
    head.slice(0, 7).forEach(function (k) { html += '<th>' + esc(k) + '</th>'; });
    html += '<th>详情</th></tr>';
    rows.forEach(function (row, idx) {
      var id = row.id !== undefined ? row.id : row.key;
      html += '<tr><td style="white-space:nowrap;">';
      if (t === 'orders' || t === 'messages') {
        html += '<select class="btn-sm" data-act="status" data-t="' + t + '" data-id="' + esc(id) + '">';
        (STATUS[t] || []).forEach(function (s) { html += '<option value="' + s + '"' + (row.status === s ? ' selected' : '') + '>' + s + '</option>'; });
        html += '</select> ';
      }
      if (t === 'gallery') {
        html += '<button class="btn-sm" data-act="tg" data-col="approved" data-id="' + esc(id) + '" data-v="' + (row.approved ? 'false' : 'true') + '">' + (row.approved ? '下架' : '上架') + '</button> ';
        html += '<button class="btn-sm" data-act="tg" data-col="visible" data-id="' + esc(id) + '" data-v="' + (row.visible ? 'false' : 'true') + '">' + (row.visible ? '隐藏' : '显示') + '</button> ';
      }
      if (t === 'users') {
        html += '<button class="btn-sm" data-act="role" data-id="' + esc(id) + '" data-v="' + (row.role === 'admin' ? 'user' : 'admin') + '">' + (row.role === 'admin' ? '降为user' : '设为admin') + '</button> ';
      }
      html += '<button class="btn-sm" data-act="edit" data-t="' + t + '" data-id="' + esc(id) + '">编辑</button> ';
      html += '<button class="btn-sm" data-act="view" data-i="' + idx + '">JSON</button> ';
      html += '<button class="btn-sm" data-act="del" data-t="' + t + '" data-id="' + esc(id) + '">删除</button></td>';
      head.slice(0, 7).forEach(function (k) {
        var v = row[k];
        html += '<td>' + esc(typeof v === 'object' ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v)).slice(0, 60) + '</td>';
      });
      html += '<td><div class="json-detail" data-detail="' + idx + '">' + esc(JSON.stringify(row, null, 2)) + '</div></td></tr>';
    });
    rowsEl.innerHTML = html;
    rowsEl.querySelectorAll('[data-act="edit"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = Number(b.getAttribute('data-i'));
        openEdit(window.__admRows[idx], b.getAttribute('data-t'));
      });
    });
    rowsEl.querySelectorAll('[data-act="view"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var d = rowsEl.querySelector('[data-detail="' + b.getAttribute('data-i') + '"]');
        d.style.display = d.style.display === 'block' ? 'none' : 'block';
      });
    });
    rowsEl.querySelectorAll('[data-act="del"]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('确认删除？')) return;
        api(DAPI, { op: 'delete', table: b.getAttribute('data-t'), id: b.getAttribute('data-id') }).then(function (r) { msg.textContent = r.ok ? '已删除' : '失败：' + (r.error || ''); load(); });
      });
    });
    rowsEl.querySelectorAll('[data-act="status"]').forEach(function (b) {
      b.addEventListener('change', function () {
        api(DAPI, { op: 'update', table: b.getAttribute('data-t'), id: b.getAttribute('data-id'), set: { status: b.value } }).then(function (r) { msg.textContent = r.ok ? '已更新' : '失败'; });
      });
    });
    rowsEl.querySelectorAll('[data-act="tg"]').forEach(function (b) {
      b.addEventListener('click', function () {
        var set = {}; set[b.getAttribute('data-col')] = b.getAttribute('data-v') === 'true';
        api(DAPI, { op: 'update', table: 'gallery', id: b.getAttribute('data-id'), set: set }).then(function (r) { msg.textContent = r.ok ? '已更新' : '失败'; load(); });
      });
    });
    rowsEl.querySelectorAll('[data-act="role"]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('更改该用户角色？')) return;
        api(DAPI, { op: 'update', table: 'users', id: b.getAttribute('data-id'), set: { role: b.getAttribute('data-v') } }).then(function (r) { msg.textContent = r.ok ? '已更新' : '失败'; load(); });
      });
    });
  }



  document.getElementById('bcSend').addEventListener('click', function () {
    var title = (document.getElementById('bcTitle').value || '').trim();
    var body = document.getElementById('bcBody').value;
    if (!title && !body) { document.getElementById('bcMsg').textContent = '标题或内容至少填一项'; return; }
    if (!confirm('确认群发站内信给全部注册用户？')) return;
    api(DAPI, { op: 'broadcast', title: title, body: body }).then(function (r) {
      document.getElementById('bcMsg').textContent = r.ok ? ('已发送 ' + (r.sent || 0) + ' / ' + (r.users || 0) + ' 个用户信箱') : ('失败：' + (r.error || ''));
    }).catch(function () { document.getElementById('bcMsg').textContent = '网络错误'; });
  });

  // ===== 搜索与行编辑 =====
  var allRows = [];
  var admSearch = document.getElementById('admSearch');
  if (admSearch) admSearch.addEventListener('input', function () {
    var t = sel.value;
    if (t === 'settings') return;
    var q = (admSearch.value || '').trim().toLowerCase();
    var rows = q ? allRows.filter(function (r) { return JSON.stringify(r).toLowerCase().indexOf(q) > -1; }) : allRows;
    window.__admRows = rows;
    msg.textContent = t + ' 共 ' + rows.length + ' 条（过滤）';
    renderRows(t, rows);
  });
  var editBox = null;
  function openEdit(row, t) {
    if (!editBox) {
      editBox = document.createElement('div');
      editBox.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99;';
      var card = document.createElement('div');
      card.style.cssText = 'width:min(640px,92vw);max-height:82vh;overflow:auto;background:#0d1220;border:1px solid var(--line);border-radius:14px;padding:18px;';
      card.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><b style="color:var(--gold);font-weight:400;">编辑行（JSON）</b><button type="button" id="admeClose" style="background:none;border:none;color:var(--moon);font-size:16px;cursor:pointer;">✕</button></div>' +
        '<textarea id="admeTxt" style="min-height:300px;font-family:monospace;font-size:12px;"></textarea>' +
        '<div style="margin-top:10px;display:flex;gap:10px;justify-content:flex-end;"><button type="button" class="btn-ghost" id="admeCancel" style="font-size:13px;padding:8px 16px;">取消</button><button type="button" class="btn-gold" id="admeSave" style="font-size:13px;padding:8px 16px;">保存修改</button></div>';
      editBox.appendChild(card);
      document.body.appendChild(editBox);
      editBox.addEventListener('click', function (e) { if (e.target === editBox) closeEdit(); });
      card.querySelector('#admeClose').addEventListener('click', closeEdit);
      card.querySelector('#admeCancel').addEventListener('click', closeEdit);
      card.querySelector('#admeSave').addEventListener('click', function () {
        var t2 = editBox.getAttribute('data-t');
        var id2 = editBox.getAttribute('data-id');
        var txt = card.querySelector('#admeTxt').value;
        var obj;
        try { obj = JSON.parse(txt); } catch (e) { msg.textContent = 'JSON 格式错误'; return; }
        delete obj.id; delete obj.key; delete obj.created_at;
        api(DAPI, { op: 'update', table: t2, id: id2, set: obj }).then(function (r) {
          msg.textContent = r.ok ? '已保存' : ('失败：' + (r.error || ''));
          if (r.ok) { closeEdit(); load(); }
        }).catch(function () { msg.textContent = '网络错误'; });
      });
    }
    editBox.setAttribute('data-t', t);
    editBox.setAttribute('data-id', row.id !== undefined ? row.id : row.key);
    editBox.querySelector('#admeTxt').value = JSON.stringify(row, null, 2);
    editBox.style.display = 'flex';
  }
  function closeEdit() { if (editBox) editBox.style.display = 'none'; }

  // ===== 快捷工具 =====
  document.querySelectorAll('.adm-tool-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-t');
      document.querySelectorAll('.adm-tool').forEach(function (x) { x.style.display = 'none'; });
      var el = document.querySelector('.adm-tool-' + t);
      if (el) el.style.display = 'block';
    });
  });
  function num(v) { var n = Number(v); return isNaN(n) ? undefined : n; }
  document.getElementById('crSave').addEventListener('click', function () {
    var name = (document.getElementById('crName').value || '').trim();
    if (!name) { document.getElementById('crMsg').textContent = '名称不能为空'; return; }
    var row = { name: name, visible: true };
    ['crKind', 'crElement', 'crMeaning', 'crCare', 'crImg', 'crColor'].forEach(function (id) {
      var v = (document.getElementById(id).value || '').trim();
      var key = id === 'crKind' ? 'kind' : id === 'crElement' ? 'element' : id === 'crMeaning' ? 'meaning' : id === 'crCare' ? 'care_tip' : id === 'crImg' ? 'image_url' : 'color_hex';
      if (v) row[key] = v;
    });
    ['crPrice', 'crStock', 'crSize'].forEach(function (id) {
      var v = num(document.getElementById(id).value);
      var key = id === 'crPrice' ? 'price' : id === 'crStock' ? 'stock_qty' : 'size_mm';
      if (v !== undefined) row[key] = v;
    });
    api(DAPI, { op: 'insert', table: 'crystals', row: row }).then(function (r) {
      document.getElementById('crMsg').textContent = r.ok ? '已保存' : (r.error || '失败');
    }).catch(function () { document.getElementById('crMsg').textContent = '网络错误'; });
  });
  function ygCode() {
    var d = new Date();
    return 'YG-' + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(Math.floor(1000 + Math.random() * 9000));
  }
  document.getElementById('recGen').addEventListener('click', function () {
    var name = (document.getElementById('recName').value || '').trim();
    if (!name) { document.getElementById('recMsg').textContent = '请填写作品名'; return; }
    var qty = Math.min(50, Math.max(1, num(document.getElementById('recQty').value) || 1));
    var note = (document.getElementById('recNote').value || '').trim();
    var img = (document.getElementById('recImg').value || '').trim();
    var codes = [], ps = [];
    for (var i = 0; i < qty; i++) {
      var code = ygCode(); codes.push(code);
      ps.push(api(DAPI, { op: 'insert', table: 'records', row: { code: code, product_ref: name, info: note ? { text: note } : {}, image_urls: img } }));
    }
    Promise.all(ps).then(function () {
      document.getElementById('recMsg').textContent = '已生成 ' + qty + ' 个';
      document.getElementById('recOut').textContent = codes.join('\n');
    }).catch(function () { document.getElementById('recMsg').textContent = '部分生成失败'; });
  });
  document.getElementById('noticeSave').addEventListener('click', function () {
    var txt = document.getElementById('noticeTxt').value;
    api(DAPI, { op: 'insert', table: 'app_data', row: { key: 'notice', value: txt || '' } }).then(function (r) {
      if (!r.ok) {
        api(DAPI, { op: 'update', table: 'app_data', id: 'notice', set: { value: txt || '' } }).then(function (r2) {
          document.getElementById('noticeMsg').textContent = r2.ok ? '已更新' : (r2.error || '失败');
        });
      } else document.getElementById('noticeMsg').textContent = '已保存';
    }).catch(function () { document.getElementById('noticeMsg').textContent = '网络错误'; });
  });

  (function () {
    var n = 0;
    function loop() { tryEnter(); n++; if (n > 14) clearInterval(iv); }
    loop();
    var iv = setInterval(loop, 1500);
  })();
})();

</script>
</body>
</html>
